name: Manual CI Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # Build once on the verification runner. Only a direct dev push can access signing
  # secrets; PR/manual/main builds use debug signing. Tests, lint and packaging
  # share one Gradle invocation; publishing reuses the exact APK.
  verify:
    name: Verify (tests, lint, release APK)
    runs-on: ubuntu-latest

    outputs:
      apk-artifact-id: ${{ steps.apk-upload.outputs.artifact-id }}

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Prepare Android native toolchain
        uses: ./.github/actions/setup-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify architecture boundaries
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/generate_debug_catalog.py --check
          python3 .github/scripts/check_architecture.py
          python3 .github/scripts/check_hook_callbacks.py

      - name: Run native sanitizer regressions
        run: python3 app/src/test/cpp/run_portable_native_tests.py --include-linux-worker

      - name: Decode Release Keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Release keystore is required}"
          : "${KEYSTORE_PASSWORD:?Keystore password is required}"
          : "${KEY_ALIAS:?Key alias is required}"
          : "${KEY_PASSWORD:?Key password is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Verify and build signed Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove release keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Verify and build review Release APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Upload verified APK
        id: apk-upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # Only this job has contents:write; it publishes the verified APK without Gradle/NDK.
  publish-ci:
    name: Publish ci-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # D21: serialise publishes so two dev pushes cannot interleave their upload/delete
    # sequence. `cancel-in-progress: false` queues the newer run instead of aborting a
    # publish halfway through, which would leave ci-latest inconsistent.
    concurrency:
      group: ci-latest-publish
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.apk-artifact-id }}
          skip-decompress: true
          path: app/build/outputs/apk/release

      - name: Verify release certificate
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android SDK apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Determine compare base
        run: |
          set -euo pipefail
          # `compareBase` is the last stable release this dev build sits on top of, so the
          # client can describe how far a CI build is from the stable channel.
          STABLE_TAG="$(git tag --list 'v[0-9]*' --sort=-creatordate | head -n 1)"
          if [ -n "$STABLE_TAG" ] && git rev-parse --verify "${STABLE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "COMPARE_BASE=$(git merge-base HEAD "${STABLE_TAG}^{commit}")" >> "$GITHUB_ENV"
          else
            echo "COMPARE_BASE=" >> "$GITHUB_ENV"
          fi

      - name: Generate update metadata from APK
        env:
          CHANNEL: ci
        run: bash .github/scripts/generate_update_metadata.sh

      # Monotonicity guard: an out-of-order run (older commit finishing later) must not
      # roll ci-latest backwards.
      - name: Check ci-latest monotonicity
        id: monotonicity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(jq -r .versionCode update-metadata.json)"
          REMOTE_CODE=""
          # Read API JSON, never a release download. Fail closed on network/auth errors.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/ci-latest" > remote-release.json 2> remote-error.txt; then
            REMOTE_CODE="$(python3 .github/scripts/release_metadata.py code remote-release.json)"
          elif ! grep -q 'HTTP 404' remote-error.txt; then
            cat remote-error.txt >&2
            exit 1
          fi
          case "$REMOTE_CODE" in
            ''|*[!0-9]*) REMOTE_CODE="" ;;
          esac
          if [ -n "$REMOTE_CODE" ] && [ "$REMOTE_CODE" -ge "$VERSION_CODE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping publish: ci-latest already carries versionCode $REMOTE_CODE >= $VERSION_CODE"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing: ci-latest versionCode '${REMOTE_CODE:-none}' < $VERSION_CODE"
          fi

      # D21: `ci-latest` is a persistent prerelease that is only ever clobbered, never
      # deleted and recreated -- recreating it would open a 404 window for links that were
      # already shared with an installer.
      - name: Publish ci-latest
        if: steps.monotonicity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view ci-latest >/dev/null 2>&1; then
            gh release create ci-latest \
              --prerelease \
              --title "CI 测试版（滚动）" \
              --target "${{ github.sha }}" \
              --notes "自动发布的最新 dev 构建。"
          fi

          # Upload APK before publishing the body that references it; remove stale assets last.
          gh release upload ci-latest app/build/outputs/apk/release/*.apk --clobber
          # Migration period: old clients still require this attachment. New clients
          # use only the API body. Both transports describe the exact same APK.
          gh release upload ci-latest build-info.json --clobber
          printf '%s\n' '自动发布的最新 dev 构建。' > release-body.txt
          python3 .github/scripts/release_metadata.py embed update-metadata.json release-body.txt
          gh release edit ci-latest --notes-file release-body.txt

          # Keep exactly the referenced APK; retain build-info.json for old clients.
          KEEP="$(jq -r .apkAsset update-metadata.json)"
          gh release view ci-latest --json assets -q '.assets[].name' \
            | { grep -E '\.apk$' || true; } \
            | { grep -vxF "$KEEP" || true; } \
            | while IFS= read -r stale; do
                [ -n "$stale" ] || continue
                echo "Deleting stale ci-latest asset: $stale"
                gh release delete-asset ci-latest "$stale" --yes
              done

      # Check the anonymous API, including GitHub's uploaded-asset digest. No release
      # asset download is needed, so verification does not inflate download counts either.
      - name: Post-publish self-check (anonymous)
        if: steps.monotonicity.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/ci-latest" -o published-release.json \
              && python3 .github/scripts/release_metadata.py verify update-metadata.json published-release.json; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      # Keep the release and its download URLs, but refresh the rolling tag only
      # after the published assets pass verification. This refreshes the release's
      # commit/date metadata; GitHub's default list order is not guaranteed by it.
      - name: Refresh ci-latest tag
        if: steps.monotonicity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PUBLISHED_COMMIT="$(jq -er .commit update-metadata.json)"
          if [ "$PUBLISHED_COMMIT" != "$GITHUB_SHA" ]; then
            echo "ERROR: refusing to move ci-latest to a commit different from the verified build."
            exit 1
          fi
          TAG_SHA="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/ci-latest" \
            -f sha="$PUBLISHED_COMMIT" -F force=true --jq .object.sha)"
          if [ "$TAG_SHA" != "$PUBLISHED_COMMIT" ]; then
            echo "ERROR: ci-latest tag does not match the verified build commit."
            exit 1
          fi
          # Moving the ref alone leaves the release's cached creation date stale.
          # Saving its target refreshes that date while preserving its ID/assets.
          gh release edit ci-latest --target "$PUBLISHED_COMMIT"
          echo "ci-latest now points to verified build $TAG_SHA; the existing prerelease and assets are retained."
