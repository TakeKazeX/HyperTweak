name: Publish Github Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (must match the project version)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A manual `workflow_dispatch` must build the tag it was given; without `ref` it
          # would silently build the default branch and publish an APK that does not
          # correspond to the tag, poisoning the update check.
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Prepare Android native toolchain
        uses: ./.github/actions/setup-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_TAG="$TAG_NAME"
          else
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Read the canonical property without configuring Android/Gradle. A cold
          # runner may print SDK/NDK installation messages even with Gradle -q,
          # contaminating a version captured from stdout.
          PROJECT_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          versions = re.findall(r'^hypertweak\.version\s*=\s*([^\r\n]+)', pathlib.Path('gradle.properties').read_text(), re.MULTILINE)
          if len(versions) != 1 or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', versions[0].strip()):
              sys.exit('ERROR: expected one hypertweak.version=<major>.<minor>.<patch> property')
          print(versions[0].strip())
          PY
          )"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [ "$CURRENT_TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: release tag '$CURRENT_TAG' does not match project version '$EXPECTED_TAG'."
            exit 1
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Release tag matches project version: $CURRENT_TAG"

      - name: Decode Release Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: release keystore, password, alias, and key password are required."
            exit 1
          fi
          echo "Decoding release keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          BUILD_CHANNEL: stable
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify release certificate
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android SDK apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Generate Changelog
        run: |
          # Only formal tags are changelog bases. Exclude rolling CI tags, which
          # can move during this build and make an unforced --tags fetch fail.
          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --no-tags --unshallow origin 'refs/tags/v*:refs/tags/v*'
          else
            git fetch --no-tags origin 'refs/tags/v*:refs/tags/v*'
          fi
          
          echo "Current tag to compare: $CURRENT_TAG"
          
          # Find the previous tag. Only `v*` tags count as a previous *release*: the
          # rolling `ci-latest` release tag belongs to the dev channel and must never be
          # picked as the changelog base.
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "Previous tag: $PREV_TAG"
          
          # Verify if the previous tag is a valid commit/ref
          if [ -n "$PREV_TAG" ] && git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
            echo "Previous tag is valid: $PREV_TAG"
          else
            echo "Previous tag $PREV_TAG is invalid or missing. Falling back to full history."
            PREV_TAG=""
          fi
          
          # Determine commit range — always use HEAD since the tag may have been
          # created before the PR was merged, making the tag point to an old commit.
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE=""
          else
            COMMIT_RANGE="$PREV_TAG..HEAD"
          fi

          if [ -z "$COMMIT_RANGE" ]; then
            echo "No previous release tag found or checking full history."
            git log --oneline --pretty=format:"%s (%h)" > raw_commits.txt || touch raw_commits.txt
            COMMIT_COUNT=$(git rev-list --count HEAD || echo "0")
          else
            echo "Listing commits for range: $COMMIT_RANGE"
            if ! git log $COMMIT_RANGE --oneline --pretty=format:"%s (%h)" > raw_commits.txt 2>log_err.txt; then
              echo "WARNING: git log failed with error:"
              cat log_err.txt
              echo "Falling back to full history."
              git log --oneline --pretty=format:"%s (%h)" > raw_commits.txt || touch raw_commits.txt
              COMMIT_COUNT=$(git rev-list --count HEAD || echo "0")
            else
              COMMIT_COUNT=$(git rev-list --count $COMMIT_RANGE 2>/dev/null || echo "0")
            fi
            rm -f log_err.txt
          fi

          touch feats.txt fixes.txt perfs.txt refactors.txt docs.txt builds.txt others.txt

          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            prefix=$(echo "$line" | grep -oE "^[a-zA-Z0-9_-]+(\([^)]+\))?:" || true)
            if [ -n "$prefix" ]; then
              type=$(echo "$prefix" | grep -oE "^[a-zA-Z0-9_-]+")
              case "$type" in
                feat)
                  echo "* $line" >> feats.txt
                  ;;
                fix)
                  echo "* $line" >> fixes.txt
                  ;;
                perf)
                  echo "* $line" >> perfs.txt
                  ;;
                refactor|style)
                  echo "* $line" >> refactors.txt
                  ;;
                docs)
                  echo "* $line" >> docs.txt
                  ;;
                build|ci|chore)
                  echo "* $line" >> builds.txt
                  ;;
                *)
                  echo "* $line" >> others.txt
                  ;;
              esac
            else
              echo "* $line" >> others.txt
            fi
          done < raw_commits.txt

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "### Changelog (1 commit since last release)" > changelog.txt
          else
            echo "### Changelog ($COMMIT_COUNT commits since last release)" > changelog.txt
          fi
          echo "" >> changelog.txt

          if [ -s feats.txt ]; then
            echo "#### 🚀 Features" >> changelog.txt
            cat feats.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s fixes.txt ]; then
            echo "#### 🐛 Bug Fixes" >> changelog.txt
            cat fixes.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s perfs.txt ]; then
            echo "#### ⚡ Performance" >> changelog.txt
            cat perfs.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s refactors.txt ]; then
            echo "#### 🛠️ Refactoring & Style" >> changelog.txt
            cat refactors.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s docs.txt ]; then
            echo "#### 📝 Documentation" >> changelog.txt
            cat docs.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s builds.txt ]; then
            echo "#### ⚙️ Build & Chore" >> changelog.txt
            cat builds.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s others.txt ]; then
            echo "#### ❓ Other Changes" >> changelog.txt
            cat others.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          rm -f raw_commits.txt feats.txt fixes.txt perfs.txt refactors.txt docs.txt builds.txt others.txt

          echo "Generated changelog:"
          cat changelog.txt

          # Export the comparison base for update-metadata.json (`compareBase`). PREV_TAG was
          # cleared above when it did not resolve to a real commit, in which case the
          # field is omitted from the JSON.
          if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            echo "COMPARE_BASE=$(git rev-parse "${PREV_TAG}^{commit}")" >> "$GITHUB_ENV"
          else
            echo "COMPARE_BASE=" >> "$GITHUB_ENV"
          fi

      - name: Generate update metadata from APK
        env:
          CHANNEL: stable
        run: bash .github/scripts/generate_update_metadata.sh

      # The release body keeps the generated changelog unless curated bilingual notes
      # exist for this tag, in which case the notes (zh + en on one page) replace it.
      - name: Prepare Release Body
        run: |
          set -euo pipefail
          if [ ! -f release-body.txt ]; then
            echo "Using the generated changelog as the release body."
            cp changelog.txt release-body.txt
          fi
          python3 .github/scripts/release_metadata.py embed update-metadata.json release-body.txt
          echo "Release body:"
          cat release-body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-body.txt
          files: |
            app/build/outputs/apk/release/*.apk
            build-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
