name: Publish Github Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (must match the project version)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A manual `workflow_dispatch` must build the tag it was given; without `ref` it
          # would silently build the default branch and publish an APK that does not
          # correspond to the tag, poisoning the update check.
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_TAG="$TAG_NAME"
          else
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          fi
          PROJECT_VERSION="$(./gradlew -q :app:printBaseVersion)"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [ "$CURRENT_TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: release tag '$CURRENT_TAG' does not match project version '$EXPECTED_TAG'."
            exit 1
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Release tag matches project version: $CURRENT_TAG"

      - name: Decode Release Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: release keystore, password, alias, and key password are required."
            exit 1
          fi
          echo "Decoding release keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          BUILD_CHANNEL: stable
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify release certificate
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android SDK apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Generate Changelog
        run: |
          # Fetch all tags safely to retrieve history
          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --tags --unshallow
          else
            git fetch --tags
          fi
          
          echo "Current tag to compare: $CURRENT_TAG"
          
          # Find the previous tag. Only `v*` tags count as a previous *release*: the
          # rolling `ci-latest` release tag belongs to the dev channel and must never be
          # picked as the changelog base.
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "Previous tag: $PREV_TAG"
          
          # Verify if the previous tag is a valid commit/ref
          if [ -n "$PREV_TAG" ] && git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
            echo "Previous tag is valid: $PREV_TAG"
          else
            echo "Previous tag $PREV_TAG is invalid or missing. Falling back to full history."
            PREV_TAG=""
          fi
          
          # Determine commit range — always use HEAD since the tag may have been
          # created before the PR was merged, making the tag point to an old commit.
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE=""
          else
            COMMIT_RANGE="$PREV_TAG..HEAD"
          fi

          if [ -z "$COMMIT_RANGE" ]; then
            echo "No previous release tag found or checking full history."
            git log --oneline --pretty=format:"%s (%h)" > raw_commits.txt || touch raw_commits.txt
            COMMIT_COUNT=$(git rev-list --count HEAD || echo "0")
          else
            echo "Listing commits for range: $COMMIT_RANGE"
            if ! git log $COMMIT_RANGE --oneline --pretty=format:"%s (%h)" > raw_commits.txt 2>log_err.txt; then
              echo "WARNING: git log failed with error:"
              cat log_err.txt
              echo "Falling back to full history."
              git log --oneline --pretty=format:"%s (%h)" > raw_commits.txt || touch raw_commits.txt
              COMMIT_COUNT=$(git rev-list --count HEAD || echo "0")
            else
              COMMIT_COUNT=$(git rev-list --count $COMMIT_RANGE 2>/dev/null || echo "0")
            fi
            rm -f log_err.txt
          fi

          touch feats.txt fixes.txt perfs.txt refactors.txt docs.txt builds.txt others.txt

          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            prefix=$(echo "$line" | grep -oE "^[a-zA-Z0-9_-]+(\([^)]+\))?:" || true)
            if [ -n "$prefix" ]; then
              type=$(echo "$prefix" | grep -oE "^[a-zA-Z0-9_-]+")
              case "$type" in
                feat)
                  echo "* $line" >> feats.txt
                  ;;
                fix)
                  echo "* $line" >> fixes.txt
                  ;;
                perf)
                  echo "* $line" >> perfs.txt
                  ;;
                refactor|style)
                  echo "* $line" >> refactors.txt
                  ;;
                docs)
                  echo "* $line" >> docs.txt
                  ;;
                build|ci|chore)
                  echo "* $line" >> builds.txt
                  ;;
                *)
                  echo "* $line" >> others.txt
                  ;;
              esac
            else
              echo "* $line" >> others.txt
            fi
          done < raw_commits.txt

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            echo "### Changelog (1 commit since last release)" > changelog.txt
          else
            echo "### Changelog ($COMMIT_COUNT commits since last release)" > changelog.txt
          fi
          echo "" >> changelog.txt

          if [ -s feats.txt ]; then
            echo "#### 🚀 Features" >> changelog.txt
            cat feats.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s fixes.txt ]; then
            echo "#### 🐛 Bug Fixes" >> changelog.txt
            cat fixes.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s perfs.txt ]; then
            echo "#### ⚡ Performance" >> changelog.txt
            cat perfs.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s refactors.txt ]; then
            echo "#### 🛠️ Refactoring & Style" >> changelog.txt
            cat refactors.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s docs.txt ]; then
            echo "#### 📝 Documentation" >> changelog.txt
            cat docs.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s builds.txt ]; then
            echo "#### ⚙️ Build & Chore" >> changelog.txt
            cat builds.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          if [ -s others.txt ]; then
            echo "#### ❓ Other Changes" >> changelog.txt
            cat others.txt >> changelog.txt
            echo "" >> changelog.txt
          fi

          rm -f raw_commits.txt feats.txt fixes.txt perfs.txt refactors.txt docs.txt builds.txt others.txt

          echo "Generated changelog:"
          cat changelog.txt

          # Export the comparison base for build-info.json (`compareBase`). PREV_TAG was
          # cleared above when it did not resolve to a real commit, in which case the
          # field is omitted from the JSON.
          if [ -n "$PREV_TAG" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            echo "COMPARE_BASE=$(git rev-parse "${PREV_TAG}^{commit}")" >> "$GITHUB_ENV"
          else
            echo "COMPARE_BASE=" >> "$GITHUB_ENV"
          fi

      # Keep this block byte-identical to the one in ci.yml: both workflows must produce
      # the same build-info.json contract for the Android client.
      - name: Generate build-info.json
        env:
          CHANNEL: stable
        run: |
          set -euo pipefail

          # The client parses these exact field names, so the JSON shape is a contract.
          # versionCode / versionName / minSdk / targetSdk are read back from the built APK
          # with aapt2 instead of being recomputed from git: the APK is the only
          # authoritative source (a shallow clone, a VERSION_CODE override or a checkout of
          # a different commit would silently desync the client's update check).
          CHANNEL="${CHANNEL:?CHANNEL must be set to ci or stable}"
          if [ "$CHANNEL" = "stable" ]; then
            NOTES_FILE="${NOTES_FILE:-.github/release-notes/${CURRENT_TAG}.md}"
          else
            NOTES_FILE=""
          fi

          extract_lang() {
            # Everything after `<!-- lang:X -->` up to the next `<!-- lang:* -->` marker.
            awk -v lang="$2" '
              $0 ~ ("^<!-- lang:" lang " -->[[:space:]]*$") { inside = 1; next }
              $0 ~ "^<!-- lang:" { inside = 0 }
              inside { print }
            ' "$1"
          }

          trim_blanks() {
            # Strip leading/trailing blank lines only; interior formatting is preserved.
            sed -e '/./,$!d' | awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }'
          }

          APK="$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: no release APK found under app/build/outputs/apk/release/"
            exit 1
          fi
          APK_ASSET="$(basename "$APK")"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "ERROR: Android SDK aapt2 was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          BADGING="$("$AAPT2" dump badging "$APK")"

          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          # build-tools 37 renamed the minimum-SDK line from `sdkVersion:` to `minSdkVersion:`,
          # so accept either spelling rather than failing the publish over a rename.
          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -nE "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p")"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -nE "s/^targetSdkVersion:'([0-9]+)'.*/\1/p")"

          # versionCode and versionName are load-bearing -- the client trusts them -- so an APK whose
          # badging cannot be read must fail the publish instead of shipping a wrong contract.
          for value in "$VERSION_CODE" "$VERSION_NAME"; do
            if [ -z "$value" ]; then
              echo "ERROR: could not read versionCode/versionName from the aapt2 badging output:"
              printf '%s\n' "$BADGING"
              exit 1
            fi
          done

          COMMIT="$(git rev-parse HEAD)"
          SHORT_COMMIT="$(git rev-parse --short=7 HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          APK_SIZE="$(stat -c%s "$APK")"

          # `notes` is stable-channel only (D19). A missing or malformed notes file is a
          # warning, never a failure: the client falls back to the English commit list.
          NOTES_ZH=""
          NOTES_EN=""
          if [ "$CHANNEL" = "stable" ]; then
            if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
              NOTES_ZH="$(extract_lang "$NOTES_FILE" zh | trim_blanks)"
              NOTES_EN="$(extract_lang "$NOTES_FILE" en | trim_blanks)"
              if [ -z "$NOTES_ZH" ] && [ -z "$NOTES_EN" ]; then
                echo "WARNING: $NOTES_FILE has no '<!-- lang:zh -->' / '<!-- lang:en -->' section; omitting notes."
              elif [ -z "$NOTES_ZH" ] || [ -z "$NOTES_EN" ]; then
                echo "WARNING: $NOTES_FILE is missing one language section; the client falls back to the other."
              fi
              if [ -n "$NOTES_ZH" ] || [ -n "$NOTES_EN" ]; then
                # Curated bilingual release body: both languages on one page.
                if [ -n "$NOTES_ZH" ] && [ -n "$NOTES_EN" ]; then
                  { printf '%s\n\n' "$NOTES_ZH"; printf -- '---\n\n'; printf '%s\n' "$NOTES_EN"; } > release-body.txt
                elif [ -n "$NOTES_ZH" ]; then
                  printf '%s\n' "$NOTES_ZH" > release-body.txt
                else
                  printf '%s\n' "$NOTES_EN" > release-body.txt
                fi
              fi
            else
              echo "WARNING: curated release notes '$NOTES_FILE' not found; the release body stays the generated changelog."
            fi
          fi

          # `jq --arg` keeps notes escaping correct (newlines, quotes, backslashes).
          # Key order mirrors docs/UPDATE_SYSTEM_PLAN.md §2.3.
          jq -n \
            --argjson schema 1 \
            --arg channel "$CHANNEL" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg commit "$COMMIT" \
            --arg shortCommit "$SHORT_COMMIT" \
            --arg builtAt "$BUILT_AT" \
            --arg compareBase "${COMPARE_BASE:-}" \
            --arg apkAsset "$APK_ASSET" \
            --argjson apkSize "$APK_SIZE" \
            --arg apkSha256 "$APK_SHA256" \
            --arg minSdk "$MIN_SDK" \
            --arg targetSdk "$TARGET_SDK" \
            --arg notesZh "$NOTES_ZH" \
            --arg notesEn "$NOTES_EN" '
              {
                schema: $schema,
                channel: $channel,
                versionName: $versionName,
                versionCode: $versionCode,
                commit: $commit,
                shortCommit: $shortCommit,
                builtAt: $builtAt
              }
              + (if $compareBase == "" then {} else { compareBase: $compareBase } end)
              + {
                apkAsset: $apkAsset,
                apkSize: $apkSize,
                apkSha256: $apkSha256
              }
              # Informational only; omitted (not zero-filled) when the badging did not carry it.
              + (if $minSdk == "" then {} else { minSdk: ($minSdk | tonumber) } end)
              + (if $targetSdk == "" then {} else { targetSdk: ($targetSdk | tonumber) } end)
              + (
                if $notesZh == "" and $notesEn == "" then {}
                else
                  {
                    notes: (
                      (if $notesZh == "" then {} else { zh: $notesZh } end)
                      + (if $notesEn == "" then {} else { en: $notesEn } end)
                    )
                  }
                end
              )
            ' > build-info.json

          jq -e . build-info.json >/dev/null
          echo "Generated build-info.json:"
          cat build-info.json

      # The release body keeps the generated changelog unless curated bilingual notes
      # exist for this tag, in which case the notes (zh + en on one page) replace it.
      - name: Prepare Release Body
        run: |
          set -euo pipefail
          if [ ! -f release-body.txt ]; then
            echo "Using the generated changelog as the release body."
            cp changelog.txt release-body.txt
          fi
          echo "Release body:"
          cat release-body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-body.txt
          files: |
            app/build/outputs/apk/release/*.apk
            build-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
